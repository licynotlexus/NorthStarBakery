<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Products</title>

  <style>
    body {
      background-color: #fbeee0; /* warm vanilla cream */
      font-family: "Georgia", serif;
      color: #5a3e2b; /* deep warm brown */
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #f4d7b7; /* warm honey peach */
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid #d1a77c; /* toasted caramel */
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #5a3e2b;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover {
      color: #b07a4a; /* warm cinnamon */
    }

    main {
      max-width: 850px;
      margin: 50px auto;
      background-color: #fff4e6; /* soft bakery cream */
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 0 18px rgba(120, 80, 50, 0.25);
    }

    h1, h2 {
      color: #8b5e3c;
    }

    picture, img {
      width: 100%;
      max-width: 600px; /* prevents huge image */
      display: block;
      margin: 0 auto 20px auto;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(120, 80, 50, 0.25);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f4d7b7;
      border-top: 4px solid #d1a77c;
      margin-top: 50px;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Bakery Products</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Fresh Pastries and Bread</h2>

    <picture>
      <source srcset="images/pastries-small.jpg" media="(max-width:600px)">
      <source srcset="images/pastries-large.jpg" media="(min-width:601px)">
      <img src="images/pastries-large.jpg" alt="Assorted pastries">
    </picture>

    <p>Our pastries are baked fresh every morning using local ingredients.</p>
  </main>

  <footer>
    <p>© 2026 North Star Bakery</p>
  </footer>
<script>
  // Load saved order on page load
  document.addEventListener("DOMContentLoaded", () => {
    const savedOrder = JSON.parse(localStorage.getItem("savedOrder"));
    const message = document.getElementById("orderMessage");

    if (savedOrder) {
      message.style.color = "#5a3e2b";
      message.textContent = `Last saved order: ${savedOrder.item} x${savedOrder.quantity} — Total: $${savedOrder.total}`;
    }
  });

  // Calculate total price
  document.getElementById("calculateBtn").addEventListener("click", () => {
    const itemSelect = document.getElementById("itemSelect");
    const quantityInput = document.getElementById("quantityInput");
    const message = document.getElementById("orderMessage");

    const item = itemSelect.value;
    const price = itemSelect.selectedOptions[0]?.getAttribute("data-price");
    const quantity = quantityInput.value;

    // Validation
    if (!item) {
      message.textContent = "Please select an item.";
      message.style.color = "red";
      return;
    }

    if (quantity < 1) {
      message.textContent = "Quantity must be at least 1.";
      message.style.color = "red";
      return;
    }

    const total = (price * quantity).toFixed(2);

    message.style.color = "#5a3e2b";
    message.textContent = `${item} x${quantity} — Total: $${total}`;
  });

  // Save order to localStorage
  document.getElementById("saveOrderBtn").addEventListener("click", () => {
    const itemSelect = document.getElementById("itemSelect");
    const quantityInput = document.getElementById("quantityInput");
    const message = document.getElementById("orderMessage");

    const item = itemSelect.value;
    const price = itemSelect.selectedOptions[0]?.getAttribute("data-price");
    const quantity = quantityInput.value;

    if (!item || quantity < 1) {
      message.textContent = "Please calculate your order before saving.";
      message.style.color = "red";
      return;
    }

    const total = (price * quantity).toFixed(2);

    const orderData = {
      item,
      quantity,
      total
    };

    localStorage.setItem("savedOrder", JSON.stringify(orderData));

    message.style.color = "#5a3e2b";
    message.textContent = `Order saved: ${item} x${quantity} — Total: $${total}`;
  });
</script>
</body>
</html>
