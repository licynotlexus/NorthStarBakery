<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>North Star Bakery Home</title>

  <style>
    body {
      background-color: #fbeee0; /* warm vanilla cream */
      font-family: "Georgia", serif;
      color: #5a3e2b; /* deep warm brown */
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #f4d7b7; /* warm honey peach */
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid #d1a77c; /* toasted caramel */
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #5a3e2b;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover {
      color: #b07a4a; /* warm cinnamon */
    }

    main {
      max-width: 850px;
      margin: 50px auto;
      background-color: #fff4e6; /* soft bakery cream */
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 0 18px rgba(120, 80, 50, 0.25);
      text-align: center;
    }

    h1, h2 {
      color: #8b5e3c;
    }

    img {
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 0 12px rgba(120, 80, 50, 0.25);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f4d7b7;
      border-top: 4px solid #d1a77c;
      margin-top: 50px;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Welcome to North Star Bakery</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Freshly Baked Every Morning</h2>

    <img src="images/loaf.jpg" alt="Fresh bakery loaf">

    <p>Welcome to North Star Bakery! We bake fresh bread, pastries, and treats every morning using local ingredients.</p>
  </main>

  <footer>
    <p>© 2026 North Star Bakery</p>
  </footer>
</body>
</html>
