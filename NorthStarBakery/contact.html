<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact North Star Bakery</title>

  <style>
    body {
      background-color: #fbeee0; /* warm vanilla cream */
      font-family: "Georgia", serif;
      color: #5a3e2b; /* deep warm brown */
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #f4d7b7; /* warm honey peach */
      padding: 25px;
      text-align: center;
      border-bottom: 4px solid #d1a77c; /* toasted caramel */
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #5a3e2b;
      font-weight: bold;
      font-size: 1.1rem;
    }

    nav a:hover {
      color: #b07a4a; /* warm cinnamon */
    }

    main {
      max-width: 850px;
      margin: 50px auto;
      background-color: #fff4e6; /* soft bakery cream */
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 0 18px rgba(120, 80, 50, 0.25); /* warm soft shadow */
    }

    fieldset {
      border: 3px solid #d1a77c;
      border-radius: 12px;
      padding: 20px;
      background-color: #fef6e8;
    }

    legend {
      font-size: 1.3rem;
      color: #8b5e3c;
      padding: 0 10px;
    }

    label {
      font-weight: bold;
      color: #5a3e2b;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 2px solid #d1a77c;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fffdf8;
    }

    button {
      background-color: #d1a77c;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #b07a4a;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f4d7b7;
      border-top: 4px solid #d1a77c;
      margin-top: 50px;
      font-size: 1rem;
    }
  </style>

  <script>
    function validateForm() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      let valid = true;

      if (name === "") {
        document.getElementById("nameError").textContent = "Please enter your name.";
        valid = false;
      } else {
        document.getElementById("nameError").textContent = "";
      }

      if (!email.match(emailPattern)) {
        document.getElementById("emailError").textContent = "Please enter a valid email.";
        valid = false;
      } else {
        document.getElementById("emailError").textContent = "";
      }

      if (message === "") {
        document.getElementById("messageError").textContent = "Please enter a message.";
        valid = false;
      } else {
        document.getElementById("messageError").textContent = "";
      }

      if (valid) {
        localStorage.setItem("userName", name);
        localStorage.setItem("userEmail", email);
        document.getElementById("formMessage").textContent = "Thank you! Your message has been sent.";
      }

      return false;
    }

    window.onload = function() {
      document.getElementById("name").value = localStorage.getItem("userName") || "";
      document.getElementById("email").value = localStorage.getItem("userEmail") || "";
    };
  </script>
</head>

<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form onsubmit="return validateForm()">
      <fieldset>
        <legend>Bakery Form</legend>

        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <span id="nameError" style="color:red"></span>

        <label for="email">Email:</label>
        <input type="email" id="email" required>
        <span id="emailError" style="color:red"></span>

        <label for="message">Message:</label>
        <textarea id="message" required></textarea>
        <span id="messageError" style="color:red"></span>

        <button type="submit">Send</button>
      </fieldset>
    </form>

    <p id="formMessage" style="color:green; font-weight:bold;"></p>
  </main>

  <footer>
    <p>© 2026 North Star Bakery</p>
  </footer>
</body>
</html>
